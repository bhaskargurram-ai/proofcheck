# proofcheck, part 2 of 2: post the proof card (PRIVILEGED, never runs PR code).
#
# Dogfooding caller for the proofcheck repository itself. Other repositories
# should run `proofcheck init` or copy examples/workflows/proofcheck-comment.yml.
#
# `workflow_run` workflows always run from the DEFAULT BRANCH, so both the
# reusable workflow (`./.github/workflows/comment.yml`) and the proofcheck
# installed by it (`github.sha`, the default branch commit) are trusted code,
# never the pull request's. See docs/SECURITY_MODEL.md.
name: proofcheck comment

on:
  workflow_run:
    workflows: ["proofcheck"]   # must match the `name:` of proofcheck.yml
    types: [completed]

permissions: {}

jobs:
  comment:
    if: github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.conclusion != 'cancelled'
    permissions:
      contents: read
      actions: read
      pull-requests: write
    uses: ./.github/workflows/comment.yml
    with:
      proofcheck-repository: ${{ github.repository }}
      proofcheck-ref: ${{ github.sha }}
      labels: true
