# proofcheck, part 1 of 2: gather evidence (UNPRIVILEGED).
#
# Dogfooding caller for the proofcheck repository itself: it calls the local
# reusable workflow and installs proofcheck from the pull request's own head
# commit, so every PR is checked by the version of proofcheck it contains.
# Other repositories should run `proofcheck init` or copy
# examples/workflows/proofcheck.yml, which pin a release instead.
#
# Because the tool comes from the PR, a PR can change how its own card is
# produced. That is acceptable only because this job is unprivileged
# (read-only token, no secrets); the privileged comment workflow installs
# proofcheck from the default branch and warns on the card when a PR touches
# workflows or the test harness.
name: proofcheck

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read
  issues: read   # `context` reads linked issues on private repositories (read-only)

concurrency:
  group: proofcheck-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  evidence:
    uses: ./.github/workflows/evidence.yml
    with:
      proofcheck-repository: ${{ github.repository }}
      proofcheck-ref: ${{ github.event.pull_request.head.sha }}
      install-command: python -m pip install -e ".[dev]"
      fail-on: never
