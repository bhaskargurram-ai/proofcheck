# Release: on a `v*` tag, build the sdist and wheel, publish them to PyPI with
# trusted publishing (no API token stored anywhere), and create a GitHub
# release whose notes are the matching CHANGELOG.md section.
#
# One-time setup (repository owner):
#   1. On PyPI, add a trusted publisher for the `proofcheck` project
#      (https://pypi.org/manage/account/publishing/ for a new project, or the
#      project's Settings -> Publishing): owner `bhaskargurram-ai`, repository
#      `proofcheck`, workflow `release.yml`, environment `pypi`.
#   2. In the GitHub repository, create the environment `pypi`
#      (Settings -> Environments); optionally require a reviewer and restrict
#      it to tags matching `v*`.
#   3. Bump the version in pyproject.toml and src/proofcheck/__init__.py, add a
#      CHANGELOG.md section `## [X.Y.Z] - date`, commit, then
#      `git tag vX.Y.Z && git push origin vX.Y.Z`.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check the tag matches the package version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          init="$(python3 -c 'import re; print(re.search(r"__version__ = \"([^\"]+)\"", open("src/proofcheck/__init__.py").read()).group(1))')"
          if [ "$TAG" != "v$version" ] || [ "$init" != "$version" ]; then
            echo "::error::tag $TAG does not match pyproject ($version) / __init__ ($init)"; exit 1
          fi
      - name: Test
        run: |
          set -euo pipefail
          python -m pip install -e ".[dev]"
          python -m pytest -q
      - name: Build sdist and wheel
        run: |
          set -euo pipefail
          python -m pip install --upgrade build
          python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/proofcheck/
    permissions:
      id-token: write   # trusted publishing (OIDC); no PyPI token is stored
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    # Not gated on the PyPI publish: the GitHub release (with the built files)
    # exists even before the one-time PyPI trusted-publisher setup is done.
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write   # create the release
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Extract release notes from CHANGELOG.md
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          python3 - "${TAG#v}" > "$RUNNER_TEMP/notes.md" <<'PY'
          import re, sys
          version = sys.argv[1]
          text = open("CHANGELOG.md", encoding="utf-8").read()
          m = re.search(r"^## \[" + re.escape(version) + r"\][^\n]*\n(.*?)(?=^## \[|\Z)", text, re.M | re.S)
          print(m.group(1).strip() if m else f"Release {version}.")
          PY
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" dist/* --title "proofcheck $TAG" --notes-file "$RUNNER_TEMP/notes.md" --verify-tag
