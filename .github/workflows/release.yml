# Release: build, test, publish to PyPI and create the GitHub release.
#
# Before releasing: bump the version in pyproject.toml and
# src/proofcheck/__init__.py, add a CHANGELOG.md section `## [X.Y.Z] - date`, and
# merge that to main. Then either:
#   * Actions -> release -> Run workflow (on main), version X.Y.Z. The workflow
#     checks the version, creates the tag vX.Y.Z on that commit, tests, builds,
#     publishes to PyPI and creates the GitHub release; nothing to push by hand;
#   * or push a tag vX.Y.Z (or create a release with a new tag on github.com).
#
# PyPI credentials (one of):
#   * repository secret PYPI_API_TOKEN: a PyPI API token. For the very first
#     upload of a new project it has to be an "Entire account" token; after
#     that, replace it with a token scoped to the proofcheck-ai project;
#   * trusted publishing, no secret at all: on PyPI add a (pending) trusted
#     publisher for the proofcheck-ai project with owner `bhaskargurram-ai`, repository `proofcheck`, workflow
#     `release.yml`, environment `pypi`, and delete the secret.
# The publish job uses the token when the secret is set, trusted publishing
# otherwise. The GitHub release does not depend on PyPI.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, X.Y.Z (must equal pyproject.toml); the tag vX.Y.Z is created"
        required: true
        type: string
      pypi:
        description: "Publish to PyPI"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Resolve the tag
        id: tag
        env:
          EVENT: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "workflow_dispatch" ]; then
            version="${INPUT_VERSION#v}"
            if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+((a|b|rc)[0-9]+)?(\.post[0-9]+)?(\.dev[0-9]+)?$'; then
              echo "::error::version '$INPUT_VERSION' is not X.Y.Z"; exit 1
            fi
            tag="v$version"
          else
            tag="$REF_NAME"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - name: Check the tag matches the package version and the changelog
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          version="$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          init="$(python3 -c 'import re; print(re.search(r"__version__ = \"([^\"]+)\"", open("src/proofcheck/__init__.py").read()).group(1))')"
          if [ "$TAG" != "v$version" ] || [ "$init" != "$version" ]; then
            echo "::error::tag $TAG does not match pyproject ($version) / __init__ ($init)"; exit 1
          fi
          if ! grep -Eq "^## \[${version//./\\.}\]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no '## [$version]' section"; exit 1
          fi
      - name: Test
        run: |
          set -euo pipefail
          python -m pip install -e ".[dev]"
          python -m pytest -q
      - name: Build sdist and wheel
        run: |
          set -euo pipefail
          python -m pip install --upgrade build twine
          python -m build
          python -m twine check --strict dist/*
      - name: Smoke-test the wheel in a clean environment
        run: |
          set -euo pipefail
          python -m venv "$RUNNER_TEMP/wheel-venv"
          "$RUNNER_TEMP/wheel-venv/bin/python" -m pip install --quiet dist/*.whl
          "$RUNNER_TEMP/wheel-venv/bin/proofcheck" --version
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7

  tag:
    # Only for "Run workflow": create the tag on the commit that was tested.
    # A tag created with the workflow's own token does not start this workflow
    # again, so there is exactly one release run.
    if: github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write   # create the tag
    steps:
      - name: Create tag ${{ needs.build.outputs.tag }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.build.outputs.tag }}
          SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if ref="$(gh api "repos/$REPO/git/ref/tags/$TAG" 2>/dev/null)"; then
            sha="$(printf '%s' "$ref" | jq -r .object.sha)"
            if [ "$(printf '%s' "$ref" | jq -r .object.type)" = "tag" ]; then
              sha="$(gh api "repos/$REPO/git/tags/$sha" --jq .object.sha)"
            fi
            if [ "$sha" != "$SHA" ]; then
              echo "::error::tag $TAG already exists on $sha, not on $SHA"; exit 1
            fi
            echo "tag $TAG already exists on $SHA"
          else
            gh api "repos/$REPO/git/refs" -f ref="refs/tags/$TAG" -f sha="$SHA" >/dev/null
            echo "created tag $TAG on $SHA"
          fi

  publish:
    needs: [build, tag]
    if: >-
      always() && needs.build.result == 'success'
      && (needs.tag.result == 'success' || needs.tag.result == 'skipped')
      && (github.event_name != 'workflow_dispatch' || inputs.pypi)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/proofcheck-ai/
    permissions:
      id-token: write   # trusted publishing (OIDC), used when PYPI_API_TOKEN is not set
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          # Empty when the secret is not set: the action then uses trusted publishing.
          password: ${{ secrets.PYPI_API_TOKEN }}
          skip-existing: true   # re-running a release does not fail on files already uploaded

  github-release:
    needs: [build, tag]
    if: >-
      always() && needs.build.result == 'success'
      && (needs.tag.result == 'success' || needs.tag.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write   # create the release
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Extract release notes from CHANGELOG.md
        env:
          TAG: ${{ needs.build.outputs.tag }}
        run: |
          set -euo pipefail
          python3 - "${TAG#v}" > "$RUNNER_TEMP/notes.md" <<'PY'
          import re, sys
          version = sys.argv[1]
          text = open("CHANGELOG.md", encoding="utf-8").read()
          m = re.search(r"^## \[" + re.escape(version) + r"\][^\n]*\n(.*?)(?=^## \[|\Z)", text, re.M | re.S)
          print(m.group(1).strip() if m else f"Release {version}.")
          PY
      - name: Create the GitHub release (or attach the files to one made on github.com)
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.build.outputs.tag }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --repo "$REPO" --clobber
          else
            gh release create "$TAG" dist/* --repo "$REPO" --title "proofcheck $TAG" --notes-file "$RUNNER_TEMP/notes.md" --verify-tag
          fi
