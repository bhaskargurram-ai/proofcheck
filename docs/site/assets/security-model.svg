<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 550" width="1000" height="550" role="img" aria-labelledby="t d">
  <title id="t">proofcheck security model: three trust zones</title>
  <desc id="d">Zone 1, evidence: the evidence job runs on pull_request, runs PR code, has a read-only token and no secrets. Zone 2, agent (opt-in): the propose job holds the LLM API key but only reads PR files as data and never executes them; the verify job runs the candidate tests and PR code with no secrets on a separate VM. Zone 3, comment: the privileged comment job has a write token, never checks out PR code, validates result.json and re-renders the card from it. Arrows are artifacts passed between jobs. No job both runs PR code and holds a secret or write token.</desc>
  <style>
    svg { --bg:#ffffff; --edge:#d1d9e0; --ink:#1f2328; --muted:#59636e; --box:#f6f8fa; --zone:#fbfcfd; --arrow:#818b98;
          --run:#bc4c00; --run-bg:#fff1e5; --key:#0969da; --key-bg:#ddf4ff; --off:#59636e; --off-bg:#eff2f5; }
    @media (prefers-color-scheme: dark) {
      svg { --bg:#151b23; --edge:#3d444d; --ink:#f0f6fc; --muted:#9198a1; --box:#1d242d; --zone:#181f28; --arrow:#6e7781;
            --run:#f0883e; --run-bg:#3d2312; --key:#4493f8; --key-bg:#0f2a4a; --off:#9198a1; --off-bg:#262c36; }
    }
    text { font-family:-apple-system, "Segoe UI", Inter, Helvetica, Arial, sans-serif; fill:var(--ink); }
    .mono { font-family:ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
    .bg { fill:var(--bg); stroke:var(--edge); }
    .zone { fill:var(--zone); stroke:var(--edge); stroke-width:1.2; stroke-dasharray:6 5; }
    .card { fill:var(--box); stroke:var(--edge); stroke-width:1.2; }
    .num { fill:var(--ink); } .numt { fill:var(--bg); font-size:13px; font-weight:700; }
    .zh { font-size:16px; font-weight:650; }
    .zs { font-size:12px; fill:var(--muted); }
    .job { font-size:14px; font-weight:650; }
    .li { font-size:12px; fill:var(--muted); }
    .run { fill:var(--run-bg); } .run-t { fill:var(--run); }
    .key { fill:var(--key-bg); } .key-t { fill:var(--key); }
    .off { fill:var(--off-bg); } .off-t { fill:var(--off); }
    .chip { font-size:11.5px; font-weight:600; }
    .wire { fill:none; stroke:var(--arrow); stroke-width:1.7; }
    .head { fill:var(--arrow); }
    .pill { fill:var(--bg); stroke:var(--arrow); }
    .pt { font-size:11.5px; fill:var(--ink); }
    .foot { font-size:13px; fill:var(--muted); }
    .footb { font-size:13px; font-weight:650; fill:var(--ink); }
  </style>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="head" d="M0 0 L10 5 L0 10 z"/>
    </marker>
  </defs>

  <rect class="bg" x="0.5" y="0.5" width="999" height="549" rx="14"/>

  <!-- zones -->
  <rect class="zone" x="20" y="20" width="280" height="440" rx="12"/>
  <circle class="num" cx="44" cy="48" r="12"/><text class="numt" x="44" y="52.5" text-anchor="middle">1</text>
  <text class="zh" x="64" y="54">Evidence</text>
  <text class="zs mono" x="36" y="84">on: pull_request</text>

  <rect class="zone" x="360" y="20" width="280" height="440" rx="12"/>
  <circle class="num" cx="384" cy="48" r="12"/><text class="numt" x="384" y="52.5" text-anchor="middle">2</text>
  <text class="zh" x="404" y="54">Agent (opt-in)</text>
  <text class="zs mono" x="376" y="84">on: workflow_run, gated</text>

  <rect class="zone" x="700" y="20" width="280" height="440" rx="12"/>
  <circle class="num" cx="724" cy="48" r="12"/><text class="numt" x="724" y="52.5" text-anchor="middle">3</text>
  <text class="zh" x="744" y="54">Comment</text>
  <text class="zs mono" x="716" y="84">on: workflow_run</text>

  <!-- evidence job -->
  <rect class="card" x="36" y="104" width="248" height="226" rx="10"/>
  <text class="job" x="50" y="130">evidence job</text>
  <rect class="run" x="50" y="144" width="104" height="22" rx="11"/>
  <text class="chip run-t" x="102" y="159" text-anchor="middle">runs PR code</text>
  <rect class="off" x="162" y="144" width="104" height="22" rx="11"/>
  <text class="chip off-t" x="214" y="159" text-anchor="middle">no secrets</text>
  <text class="li" x="50" y="192">Runs tests, issue reproducers</text>
  <text class="li" x="50" y="212">Token: read-only</text>
  <text class="li mono" x="50" y="232">persist-credentials: false</text>
  <text class="li" x="50" y="252">Config read from base commit</text>
  <text class="li" x="50" y="272">Scrubbed env, timeouts</text>
  <text class="li" x="50" y="292">Card shown in the job summary</text>

  <!-- propose job -->
  <rect class="card" x="376" y="104" width="248" height="152" rx="10"/>
  <text class="job" x="390" y="130">propose job</text>
  <rect class="off" x="390" y="144" width="104" height="22" rx="11"/>
  <text class="chip off-t" x="442" y="159" text-anchor="middle">no PR code</text>
  <rect class="key" x="502" y="144" width="104" height="22" rx="11"/>
  <text class="chip key-t" x="554" y="159" text-anchor="middle">LLM API key</text>
  <text class="li" x="390" y="192">Reads PR files as data (git)</text>
  <text class="li" x="390" y="212">Read-only tools, no exec</text>
  <text class="li" x="390" y="232">Output: schema-checked tests</text>

  <!-- verify job -->
  <rect class="card" x="376" y="306" width="248" height="140" rx="10"/>
  <text class="job" x="390" y="332">verify job</text>
  <rect class="run" x="390" y="346" width="104" height="22" rx="11"/>
  <text class="chip run-t" x="442" y="361" text-anchor="middle">runs PR code</text>
  <rect class="off" x="502" y="346" width="104" height="22" rx="11"/>
  <text class="chip off-t" x="554" y="361" text-anchor="middle">no secrets</text>
  <text class="li" x="390" y="394">Runs candidates on base, head</text>
  <text class="li" x="390" y="414">Separate VM from propose</text>
  <text class="li mono" x="390" y="434">contents: read</text>

  <!-- comment job -->
  <rect class="card" x="716" y="104" width="248" height="342" rx="10"/>
  <text class="job" x="730" y="130">comment job</text>
  <rect class="off" x="730" y="144" width="104" height="22" rx="11"/>
  <text class="chip off-t" x="782" y="159" text-anchor="middle">no PR code</text>
  <rect class="key" x="842" y="144" width="104" height="22" rx="11"/>
  <text class="chip key-t" x="894" y="159" text-anchor="middle">write token</text>
  <text class="li" x="730" y="192">Never checks out PR code</text>
  <text class="li" x="730" y="212">Validates result.json schema</text>
  <text class="li" x="730" y="232">Checks the PR head SHA</text>
  <text class="li" x="730" y="252">Re-renders the card from JSON</text>
  <text class="li" x="730" y="272">Ignores the uploaded card.md</text>
  <text class="li" x="730" y="292">Upserts comment, sets label</text>

  <rect class="off" x="730" y="318" width="220" height="112" rx="8"/>
  <text class="li" x="744" y="344" style="fill:var(--ink);font-weight:600">Never used here:</text>
  <text class="li mono" x="744" y="366">pull_request_target</text>
  <text class="li" x="744" y="386">with a checkout of the PR head</text>
  <text class="li" x="744" y="406">(the “pwn request” pattern)</text>

  <!-- artifacts -->
  <path class="wire" d="M284 180 L 372 180" marker-end="url(#arr)"/>
  <rect class="pill" x="288" y="169" width="80" height="22" rx="11"/>
  <text class="pt mono" x="328" y="184" text-anchor="middle">result</text>

  <path class="wire" d="M500 256 L 500 302" marker-end="url(#arr)"/>
  <rect class="pill" x="446" y="268" width="108" height="22" rx="11"/>
  <text class="pt" x="500" y="283" text-anchor="middle">candidate tests</text>

  <path class="wire" d="M624 376 L 712 376" marker-end="url(#arr)"/>
  <rect class="pill" x="628" y="365" width="80" height="22" rx="11"/>
  <text class="pt mono" x="668" y="380" text-anchor="middle">result</text>

  <polyline class="wire" points="160,330 160,486 840,486 840,450" marker-end="url(#arr)"/>
  <rect class="pill" x="372" y="475" width="256" height="22" rx="11"/>
  <text class="pt" x="500" y="490" text-anchor="middle">result artifact (treated as untrusted)</text>

  <text class="foot" x="500" y="530" text-anchor="middle"><tspan>Arrows are artifacts.</tspan> <tspan class="footb">No job both runs PR code and holds a secret or a write token.</tspan></text>
</svg>
