[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "proofcheck"
version = "0.1.0"
description = "Evidence, not authorship: check whether a pull request actually does what it claims."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Bhaskar Gurram", email = "bhaskargurram.g123@gmail.com" }]
requires-python = ">=3.10"
keywords = ["github-action", "pull-request", "code-review", "testing", "fail-to-pass", "maintainers"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "click>=8.0",
    "tomli>=1.1; python_version < '3.11'",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
proofcheck = "proofcheck.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
