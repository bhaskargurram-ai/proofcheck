[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "proofcheck-ai"
version = "1.0.1"
description = "Evidence, not authorship: check whether a pull request actually does what it claims."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Bhaskar Gurram", email = "gurrambhaskar.ai@gmail.com" }]
requires-python = ">=3.10"
keywords = ["github-action", "pull-request", "code-review", "testing", "fail-to-pass", "maintainers"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "click>=8.0",
    "tomli>=1.1; python_version < '3.11'",
]

[project.optional-dependencies]
dev = ["pytest>=7", "pyyaml>=6"]

[project.urls]
Homepage = "https://github.com/bhaskargurram-ai/proofcheck"
Documentation = "https://github.com/bhaskargurram-ai/proofcheck#readme"
Changelog = "https://github.com/bhaskargurram-ai/proofcheck/blob/main/CHANGELOG.md"
Issues = "https://github.com/bhaskargurram-ai/proofcheck/issues"

[project.scripts]
proofcheck = "proofcheck.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
